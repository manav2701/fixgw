# fixgw acceptor settings (quickfix format).
# To add a counterparty: add a [SESSION] block here and an entry in the
# credentials file keyed by the same TargetCompID.

[DEFAULT]
ConnectionType=acceptor
SocketAcceptAddress=127.0.0.1
SocketAcceptPort=5001
BeginString=FIX.4.4
SenderCompID=FIXGW

# 00:00:00 to 00:00:00 means the session is always on.
StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30

DataDictionary=spec/FIX44.xml
CheckLatency=Y
MaxLatency=120
ResetOnLogon=N

# Used only with -store file.
FileStorePath=store

[SESSION]
TargetCompID=CLIENT1

[SESSION]
TargetCompID=DEMO
