# fixgw acceptor settings for the container image. Same as fixgw.cfg except the
# acceptor listens on all interfaces (the compose file decides what is published)
# and paths are inside the image.

[DEFAULT]
ConnectionType=acceptor
SocketAcceptAddress=0.0.0.0
SocketAcceptPort=5001
BeginString=FIX.4.4
SenderCompID=FIXGW

StartTime=00:00:00
EndTime=00:00:00
HeartBtInt=30

DataDictionary=/app/spec/FIX44.xml
CheckLatency=Y
MaxLatency=120
ResetOnLogon=N

FileStorePath=/data/store

[SESSION]
TargetCompID=CLIENT1

[SESSION]
TargetCompID=DEMO
